name: CI

on:
  push:
    branches: [prod, main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_BUILD_JOBS: 8
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: |
          exec 3<&- 6<&-
          export OXIDEPM_HOME
          OXIDEPM_HOME=$(mktemp -d /tmp/op.XXXXXX)
          trap 'rm -rf -- "$OXIDEPM_HOME"' EXIT
          export TMPDIR="$OXIDEPM_HOME/tmp"
          mkdir -p "$TMPDIR"
          cargo test --workspace --no-fail-fast

  unused-deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install cargo-machete
        run: cargo install cargo-machete --locked --version 0.9.2
      - run: cargo machete

  process-spawning:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check daemon process spawning
        run: |
          git ls-files 'crates/oxidepmd/src/*.rs' 'crates/oxidepm-health/src/*.rs' |
            xargs awk '
              FNR == 1 { tests = 0 }
              /^mod tests[[:space:]]*\{/ { tests = 1 }
              !tests && /Command::new/ {
                print FILENAME ":" FNR ": Spawn daemon children through oxidepm-runtime"
                found = 1
              }
              END { exit found }
            '
