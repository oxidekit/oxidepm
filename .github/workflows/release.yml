name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_BUILD_JOBS: 8

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            deb_arch: amd64
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            deb_arch: arm64
    env:
      TARGET: ${{ matrix.target }}
      DEB_ARCH: ${{ matrix.deb_arch }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: oxidepm
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: oxidekit/oxidepm-adapters
          ref: ${{ github.ref }}
          path: oxidepm-adapters
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build OxidePM
        working-directory: oxidepm
        run: |
          cargo build --release --target "$TARGET" -p oxidepm -p oxidepmd -p oxidepm-sandbox
          test "$(target/"$TARGET"/release/oxidepm --version)" = "oxidepm ${GITHUB_REF_NAME#v}"

      - name: Build the adapter bundle
        working-directory: oxidepm-adapters
        run: |
          bash ../oxidepm/scripts/build-adapter-bundle.sh "$TARGET" ../oxidepm/share/oxidepm/adapters \
            "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME" "$GITHUB_RUN_NUMBER"

      - name: Package archives
        working-directory: oxidepm
        run: |
          tar -czf "oxidepm-$TARGET.tar.gz" \
            -C "$PWD/target/$TARGET/release" oxidepm oxidepmd oxidepm-sandbox \
            -C "$PWD" share LICENSE-MIT LICENSE-APACHE
          tar -czf "oxidepm-adapters-$TARGET.tar.gz" -C share/oxidepm/adapters .

      - name: Build Debian package
        working-directory: oxidepm
        run: |
          version=$(sh scripts/deb-version.sh "$GITHUB_REF_NAME")
          release_version=${GITHUB_REF_NAME#v}
          pkg="oxidepm_${release_version//-/.}_${DEB_ARCH}"
          install -dm755 "$pkg/DEBIAN" "$pkg/usr/bin" "$pkg/usr/lib/systemd/user" \
            "$pkg/usr/share/oxidepm" "$pkg/usr/share/doc/oxidepm"
          cp "target/$TARGET/release/"{oxidepm,oxidepmd,oxidepm-sandbox} "$pkg/usr/bin/"
          cp -R share/oxidepm/adapters "$pkg/usr/share/oxidepm/"
          cp LICENSE-MIT LICENSE-APACHE "$pkg/usr/share/doc/oxidepm/"

          cat > "$pkg/DEBIAN/control" << EOF
          Package: oxidepm
          Version: $version
          Section: utils
          Priority: optional
          Architecture: $DEB_ARCH
          Maintainer: Nayiem Willems <nayiem@mono-labs.org>
          Description: Process manager written in Rust with adapter support
           OxidePM supervises processes, handles restart and health policies, and
           supports optional runtime and tooling adapters.
          Homepage: https://github.com/$GITHUB_REPOSITORY
          EOF

          cat > "$pkg/DEBIAN/postinst" << 'EOF'
          #!/bin/sh
          if [ "$1" = configure ]; then
              echo "Import the bundled runtimes with: oxidepm adapter import --bundled --tag runtime --enable --yes"
          fi
          EOF
          chmod 755 "$pkg/DEBIAN/postinst"

          cat > "$pkg/usr/lib/systemd/user/oxidepmd.service" << 'EOF'
          [Unit]
          Description=OxidePM Process Manager Daemon
          After=network.target

          [Service]
          Type=simple
          ExecStart=/usr/bin/oxidepmd
          Restart=on-failure
          RestartSec=5
          TimeoutStopSec=160
          KillMode=mixed

          [Install]
          WantedBy=default.target
          EOF
          dpkg-deb --root-owner-group --build "$pkg"
          test "$(dpkg-deb -f "$pkg.deb" Version)" = "$version"

      - name: Stage packages and adapter archives
        working-directory: oxidepm
        run: |
          mkdir release-input
          mv "oxidepm-$TARGET.tar.gz" "oxidepm-adapters-$TARGET.tar.gz" release-input/
          mv ./*.deb release-input/
          cp -R share/oxidepm/adapters release-input/adapters

      - uses: actions/upload-artifact@v4
        with:
          name: oxidepm-${{ matrix.target }}
          path: oxidepm/release-input/
          if-no-files-found: error

  release:
    name: Publish release assets
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/download-artifact@v4
        with:
          path: bundles
          pattern: oxidepm-*
      - name: Install minisign
        run: |
          sudo apt-get update
          sudo apt-get install -y minisign
      - name: Prepare release assets
        shell: bash
        run: |
          cargo build -p oxidepm-adapter-proto --example catalogue
          adapter_names=$(bash scripts/build-adapter-bundle.sh --list)
          mapfile -t names <<< "$adapter_names"
          release_date=$(TZ=UTC git show -s --format=%cd --date=format-local:%Y-%m-%d HEAD)
          target/debug/examples/catalogue prepare "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" "$release_date" \
            bundles artifacts "${names[@]}"
          (cd artifacts && LC_ALL=C sha256sum -- *.tar.gz *.deb adapter-catalogue-input.json > checksums.txt)
      - name: Sign release checksums
        env:
          OXIDEPM_MINISIGN_KEY: ${{ secrets.OXIDEPM_MINISIGN_KEY }}
        shell: bash
        run: |
          set +x
          : "${OXIDEPM_MINISIGN_KEY:?Missing release signing key}"
          umask 077
          key_dir=$(mktemp -d "$RUNNER_TEMP/oxidepm-sign.XXXXXXXX")
          trap 'rm -f -- "$key_dir/minisign.key" && rmdir -- "$key_dir"' EXIT
          key_file="$key_dir/minisign.key"
          printf '%s\n' "$OXIDEPM_MINISIGN_KEY" > "$key_file"
          unset OXIDEPM_MINISIGN_KEY

          comment="oxidepm release checksums tag=$GITHUB_REF_NAME"
          minisign -S -s "$key_file" -m artifacts/checksums.txt -x artifacts/checksums.txt.minisig -t "$comment" </dev/null
          verified_comment=$(minisign -V -H -Q -P 'RWQMeVEZKn2/BHzgJLldWbECE2BqKV4a0rmNXEzn5N0lxrSi/dDuFjHC' \
            -m artifacts/checksums.txt -x artifacts/checksums.txt.minisig)
          if [ "$verified_comment" != "$comment" ]; then
            echo 'Release signature has an unexpected trusted comment' >&2
            exit 1
          fi
      - name: Upload and verify a draft before publishing
        env:
          GH_TOKEN: ${{ github.token }}
        run: sh scripts/publish-adapter-catalogue.sh release "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" artifacts

  catalogue:
    name: Publish adapter catalogue
    needs: release
    permissions:
      contents: write
    uses: ./.github/workflows/adapter-catalogue.yml
    with:
      tag: ${{ github.ref_name }}
      bootstrap: ${{ vars.OXIDEPM_CATALOGUE_BOOTSTRAP_TAG == github.ref_name }}
    secrets:
      OXIDEPM_MINISIGN_KEY: ${{ secrets.OXIDEPM_MINISIGN_KEY }}
