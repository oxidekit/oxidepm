name: Adapter catalogue

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      bootstrap:
        type: boolean
        default: false
    secrets:
      OXIDEPM_MINISIGN_KEY:
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Published version tag to retry. Leave empty to renew the catalogue.
        type: string
      bootstrap:
        description: Allow a published tag to seed the catalogue branch.
        type: boolean
        default: false
  schedule:
    - cron: '23 10 * * 1'

permissions:
  contents: read

env:
  CARGO_BUILD_JOBS: 8

jobs:
  publish:
    name: Publish or renew the adapter catalogue
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Build catalogue tooling and install minisign
        run: |
          cargo build -p oxidepm-adapter-proto --example catalogue
          sudo apt-get update
          sudo apt-get install -y minisign
      - name: Verify and publish the signed pair
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          BOOTSTRAP: ${{ inputs.bootstrap }}
          GH_TOKEN: ${{ github.token }}
          OXIDEPM_MINISIGN_KEY: ${{ secrets.OXIDEPM_MINISIGN_KEY }}
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: credential.helper
          GIT_CONFIG_VALUE_0: '!gh auth git-credential'
          GIT_TERMINAL_PROMPT: '0'
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        shell: bash
        run: |
          remote="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          if [[ -n "$RELEASE_TAG" ]]; then
            options=()
            if [[ "$BOOTSTRAP" == true ]]; then
              options+=(--bootstrap)
            fi
            sh scripts/publish-adapter-catalogue.sh advance "$GITHUB_REPOSITORY" "$remote" "$RELEASE_TAG" "${options[@]}"
          elif [[ "$BOOTSTRAP" == true ]]; then
            echo 'Bootstrap requires a published release tag' >&2
            exit 1
          else
            sh scripts/publish-adapter-catalogue.sh renew "$GITHUB_REPOSITORY" "$remote"
          fi

  expiry:
    name: Check for imminent catalogue expiry
    needs: publish
    if: always() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify expiry from the signed branch history
        run: |
          cargo build -p oxidepm-adapter-proto --example catalogue
          sh scripts/publish-adapter-catalogue.sh check-expiry "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
