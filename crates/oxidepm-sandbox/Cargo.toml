[package]
name = "oxidepm-sandbox"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "The OS sandbox for OxidePM adapters: the profile, the capability probe and the launcher binary"

[features]
# The launcher binary and the two crates only it uses. The daemon depends on this package without
# the feature, so it carries no Landlock or seccomp code.
default = ["launcher"]
launcher = ["dep:landlock", "dep:seccompiler"]

[lib]
name = "oxidepm_sandbox"
path = "src/lib.rs"

[[bin]]
name = "oxidepm-sandbox"
path = "src/main.rs"
required-features = ["launcher"]

[dependencies]
oxidepm-adapter-proto = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
libc = "0.2"

# These dependencies use Linux-specific syscalls.
[target.'cfg(target_os = "linux")'.dependencies]
landlock = { version = "0.4.7", optional = true }
seccompiler = { version = "0.5.0", optional = true }

[dev-dependencies]
tempfile = { workspace = true }
