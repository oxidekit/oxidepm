[workspace]
resolver = "2"
members = [
    "crates/oxidepm",
    "crates/oxidepmd",
    "crates/oxidepm-core",
    "crates/oxidepm-ipc",
    "crates/oxidepm-runtime",
    "crates/oxidepm-logs",
    "crates/oxidepm-db",
    "crates/oxidepm-health",
    "crates/oxidepm-fetch",
    "crates/oxidepm-adapter-proto",
    "crates/oxidepm-adapter-fixture",
    "crates/oxidepm-sandbox",
]

[workspace.package]
version = "0.4.0-rc.1"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.75"

[workspace.dependencies]
# Async
tokio = { version = "1.35", features = ["full"] }
tokio-util = { version = "0.7", features = ["net", "codec"] }
futures = "0.3"
async-trait = "0.1"

# CLI
clap = { version = "4.4", features = ["derive", "env"] }
dialoguer = "0.11"
console = "0.15"
indicatif = "0.17"
tabled = "0.15"
colored = "2.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
toml = "0.8"

# Database
sqlx = { version = "0.7", features = ["runtime-tokio", "sqlite"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

# Metrics
sysinfo = "0.30"

reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls"] }
# the HTTP probe of the daemon: TLS without a general HTTP client
tokio-rustls = { version = "0.24", default-features = false, features = ["tls12"] }
webpki-roots = "0.25"

# Concurrency
parking_lot = "0.12"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Compression
flate2 = "1.0"

# Cron scheduling
cron = "0.13"

# Shell completions
clap_complete = "4.4"
clap_mangen = "0.2"

# Utils
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4"] }
bytes = "1.5"
dotenvy = "0.15"
dirs = "5.0"
which = "6.0"
nix = { version = "0.28", features = ["signal", "process", "fs", "user"] }
regex = "1.10"
once_cell = "1.19"
atty = "0.2"
subtle = "2"
sha2 = "0.10"

# Testing
tempfile = "3.10"
assert_cmd = "2.0"
predicates = "3.1"

# Internal crates
oxidepm-core = { path = "crates/oxidepm-core" }
oxidepm-ipc = { path = "crates/oxidepm-ipc" }
oxidepm-runtime = { path = "crates/oxidepm-runtime" }
oxidepm-logs = { path = "crates/oxidepm-logs" }
oxidepm-db = { path = "crates/oxidepm-db" }
oxidepm-health = { path = "crates/oxidepm-health" }
oxidepm-fetch = { path = "crates/oxidepm-fetch" }
oxidepm-adapter-proto = { path = "crates/oxidepm-adapter-proto" }
oxidepm-sandbox = { path = "crates/oxidepm-sandbox", default-features = false }

[profile.release]
lto = true
codegen-units = 1
strip = true
